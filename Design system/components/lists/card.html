<!-- @dsCard group="Components" viewport="700x360" subtitle="ListRow — light + dark" name="Lists" -->
<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
function ListRow({ avatar, title, subtitle, positive, trailing }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:"var(--surface-row)",borderRadius:"var(--radius-md)"}}>
      {avatar && <div style={{width:36,height:36,borderRadius:"var(--radius-pill)",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--accent-primary-tint)",color:"var(--accent-primary)"}}>
        <i data-lucide={avatar} style={{width:18,height:18}}></i></div>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{font:"700 15px/1.4 var(--font-sans)",color:"var(--text-primary)"}}>{title}</div>
        {subtitle && <div style={{font:"var(--text-caption)",color:positive?"var(--text-positive)":"var(--text-secondary)",marginTop:2}}>{subtitle}</div>}
      </div>
      {trailing}
    </div>
  );
}
function App() {
  const Content = () => (
    <div style={{display:"flex",flexDirection:"column",gap:10,padding:16}}>
      <ListRow avatar="users" title="Joel220626" subtitle="Ola 1" />
      <ListRow title="Yamilet Sanchez" subtitle="Enviar Dirección Cliente" positive trailing={<i data-lucide="chevron-right" style={{width:18,height:18,color:"var(--text-tertiary)"}}></i>} />
      <ListRow title="Localizacion" subtitle="Inactiva | Iniciada 1..." trailing={<i data-lucide="chevron-right" style={{width:18,height:18,color:"var(--text-tertiary)"}}></i>} />
    </div>
  );
  return (
    <div style={{display:"flex"}}>
      <div style={{flex:1,background:"var(--surface-app)",backgroundImage:"var(--bg-app-gradient)"}}><Content /></div>
      <div data-theme="dark" style={{flex:1,background:"var(--surface-app)",backgroundImage:"var(--bg-app-gradient)"}}><Content /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
lucide.createIcons();
</script>
</body></html>
