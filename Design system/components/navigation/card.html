<!-- @dsCard group="Components" viewport="700x460" subtitle="NavHeader, TopTabs, SegmentedControl, BottomNav — light + dark" name="Navigation" -->
<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
function NavHeader({ title, onBack }) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px"}}>
      <div style={{width:32,display:"flex"}}>{onBack && <i data-lucide="chevron-left" style={{width:22,height:22,color:"var(--text-secondary)"}}></i>}</div>
      <div style={{font:"var(--text-heading)",color:"var(--text-primary)",flex:1,textAlign:"center"}}>{title}</div>
      <div style={{width:32}} />
    </div>
  );
}
function TopTabs({ tabs, activeIndex }) {
  return (
    <div style={{display:"flex",borderBottom:"1px solid var(--border-subtle)"}}>
      {tabs.map((t,i)=>(
        <div key={t} style={{flex:1,padding:"12px 8px",textAlign:"center",font:"var(--text-body)",fontWeight:i===activeIndex?700:400,
          color:i===activeIndex?"var(--text-primary)":"var(--text-secondary)",
          borderBottom:i===activeIndex?"2px solid var(--accent-interactive)":"2px solid transparent",marginBottom:-1}}>{t}</div>
      ))}
    </div>
  );
}
function SegmentedControl({ options, activeIndex }) {
  return (
    <div style={{display:"flex",background:"var(--surface-row)",borderRadius:"var(--radius-pill)",padding:4}}>
      {options.map((o,i)=>(
        <div key={o} style={{flex:1,padding:"10px 12px",textAlign:"center",borderRadius:"var(--radius-pill)",
          background:i===activeIndex?"var(--surface-card)":"transparent",boxShadow:i===activeIndex?"var(--shadow-card)":"none",
          font:"700 15px/1.4 var(--font-sans)",color:i===activeIndex?"var(--text-primary)":"var(--text-secondary)"}}>{o}</div>
      ))}
    </div>
  );
}
function BottomNav({ items, activeIndex }) {
  return (
    <div style={{display:"flex",background:"var(--surface-card)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-card)",padding:"8px 4px"}}>
      {items.map((it,i)=>(
        <div key={it.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"6px 4px",
          color:i===activeIndex?"var(--accent-interactive)":"var(--text-secondary)"}}>
          <i data-lucide={it.icon} style={{width:18,height:18}}></i>
          <span style={{font:"11px/1.3 var(--font-sans)",fontWeight:i===activeIndex?700:400}}>{it.label}</span>
        </div>
      ))}
    </div>
  );
}
function App() {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,padding:16}}>
      <div style={{background:"var(--surface-card)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-card)"}}>
        <NavHeader title="Localizacion" onBack />
        <TopTabs tabs={["Indicadores","Detalles de contacto"]} activeIndex={1} />
      </div>
      <SegmentedControl options={["Reporte","Contactos"]} activeIndex={1} />
      <BottomNav activeIndex={0} items={[
        {icon:"layout-grid",label:"Dashboards"},{icon:"badge-check",label:"Calidad"},
        {icon:"shield-check",label:"Cumplimiento"},{icon:"lightbulb",label:"Insights"},{icon:"settings",label:"Ajustes"}
      ]} />
    </div>
  );
}
function Screen({ dark }) {
  return (
    <div data-theme={dark ? "dark" : undefined} style={{flex:1,display:"flex",flexDirection:"column",gap:16,padding:16,
      background:"var(--surface-app)",backgroundImage:"var(--bg-app-gradient)",borderRadius:12}}>
      <div style={{background:"var(--surface-card)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-card)"}}>
        <NavHeader title="Localizacion" onBack />
        <TopTabs tabs={["Indicadores","Detalles de contacto"]} activeIndex={1} />
      </div>
      <SegmentedControl options={["Reporte","Contactos"]} activeIndex={1} />
      <BottomNav activeIndex={0} items={[
        {icon:"layout-grid",label:"Dashboards"},{icon:"badge-check",label:"Calidad"},
        {icon:"shield-check",label:"Cumplimiento"},{icon:"lightbulb",label:"Insights"},{icon:"settings",label:"Ajustes"}
      ]} />
    </div>
  );
}
function App2() {
  return <div style={{display:"flex",gap:0}}><Screen dark={false} /><Screen dark={true} /></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App2 />);
lucide.createIcons();
</script>
</body></html>
