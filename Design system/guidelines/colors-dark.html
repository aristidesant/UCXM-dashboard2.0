<!-- @dsCard group="Colors" viewport="700x160" subtitle="Same accents, inverted surfaces — toggle via data-theme=dark" name="Dark Theme" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}
.wrap{padding:16px;background:var(--surface-app);background-image:var(--bg-app-gradient);display:flex;gap:10px}
.sw{flex:1;height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:700;box-shadow:var(--shadow-card)}
</style></head><body>
<div class="wrap" data-theme="dark">
<div class="sw" style="background:var(--surface-card);color:var(--text-primary)">surface-card</div>
<div class="sw" style="background:var(--surface-row);color:var(--text-primary)">surface-row</div>
<div class="sw" style="background:var(--accent-primary);color:#fff">accent-primary</div>
<div class="sw" style="background:var(--accent-interactive);color:#fff">accent-interactive</div>
</div>
</body></html>
