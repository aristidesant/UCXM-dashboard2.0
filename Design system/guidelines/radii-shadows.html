<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app);display:flex;gap:16px;align-items:flex-start}
.box{background:var(--surface-card);display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--text-secondary)}
</style></head><body>
<div class="box" style="width:140px;height:90px;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)">card / 20px</div>
<div class="box" style="width:140px;height:90px;border-radius:var(--radius-md);background:var(--surface-row)">row / 14px</div>
<div class="box" style="width:140px;height:44px;border-radius:var(--radius-pill);background:var(--surface-row)">pill / full</div>
</body></html>
