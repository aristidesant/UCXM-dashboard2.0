<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base scale" name="Spacing Scale" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app);display:flex;align-items:flex-end;gap:10px}
.bar{background:var(--accent-interactive);width:24px}
.lbl{font:var(--text-micro);color:var(--text-secondary);text-align:center;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="col"><div class="bar" style="height:var(--space-1)"></div><div class="lbl">4</div></div>
<div class="col"><div class="bar" style="height:var(--space-2)"></div><div class="lbl">8</div></div>
<div class="col"><div class="bar" style="height:var(--space-3)"></div><div class="lbl">12</div></div>
<div class="col"><div class="bar" style="height:var(--space-4)"></div><div class="lbl">16</div></div>
<div class="col"><div class="bar" style="height:var(--space-5)"></div><div class="lbl">20</div></div>
<div class="col"><div class="bar" style="height:var(--space-6)"></div><div class="lbl">24</div></div>
<div class="col"><div class="bar" style="height:var(--space-8)"></div><div class="lbl">32</div></div>
</body></html>
