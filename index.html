<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Localization Campaign Management</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <svg
      id="background-effects"
      style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"
      preserveAspectRatio="none"
    >
      <defs>
        <radialGradient id="grad1" cx="95%" cy="5%" r="50%">
          <stop offset="0%" style="stop-color:rgba(38, 211, 102, 0.4);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(38, 211, 102, 0);stop-opacity:1" />
        </radialGradient>
        <radialGradient id="grad2" cx="50%" cy="120%" r="60%" fx="50%" fy="50%">
          <stop offset="0%" style="stop-color:rgba(38, 211, 102, 0.3);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(38, 211, 102, 0);stop-opacity:1" />
        </radialGradient>
        <radialGradient id="grad3" cx="-20%" cy="105%" r="65%" fx="-20%" fy="105%">
          <stop offset="0%" style="stop-color:rgba(38, 211, 102, 0.3);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(38, 211, 102, 0);stop-opacity:1" />
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="#0b0f14" />
      <rect width="100%" height="100%" fill="url(#grad1)" />
      <rect width="100%" height="100%" fill="url(#grad2)" />
      <rect width="100%" height="100%" fill="url(#grad3)" />
    </svg>
    <div id="root" style="position: relative; z-index: 1; width: 100%; height: 100%;"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
