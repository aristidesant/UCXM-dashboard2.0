<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Localization Campaign Management</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="background-effects"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        background-color: #0b0f14;
        background-image:
          radial-gradient(circle at 95% 5%, rgba(38, 211, 102, 0.8) 0%, transparent 25%),
          radial-gradient(ellipse 900px 700px at 50% 120%, rgba(38, 211, 102, 0.6) 0%, transparent 45%),
          radial-gradient(ellipse 800px 900px at -20% 105%, rgba(38, 211, 102, 0.6) 0%, transparent 55%);
        background-size: 100% 100%;
        background-attachment: fixed;
        background-repeat: no-repeat;
      "
    ></div>
    <div id="root" style="position: relative; z-index: 1; width: 100%; height: 100%;"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
